name: Production quality gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run QA helper tests
        run: npm run test:qa
      - name: Type-check application
        run: npm run typecheck
      - name: Build editor and player
        run: npm run build
      - name: Validate build artifacts
        run: npm run qa:build
